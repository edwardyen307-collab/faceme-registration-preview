# Example: terminate TLS on intranet reverse proxy and same-origin the SPA + /api
# Adjust server_name, cert paths, and upstream port. Intranet ACL recommended.

upstream faceme_thin_backend {
    server 127.0.0.1:8443;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name faceme-proxy.intranet.example;

    ssl_certificate     /etc/ssl/certs/faceme-proxy.crt;
    ssl_certificate_key /etc/ssl/private/faceme-proxy.key;

    # Optional: restrict to corporate network
    # allow 10.0.0.0/8;
    # deny all;

    client_max_body_size 8m;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://faceme_thin_backend;
    }
}
